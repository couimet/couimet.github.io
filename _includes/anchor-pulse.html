<script>
  (function () {
    function revealAnchoredArticle() {
      if (!window.location.hash) return;
      var id = window.location.hash.slice(1);
      if (!id) return;

      var el = document.getElementById(id);
      if (!el) return;
      if (!el.classList.contains("article-item") && id !== "featured-in") return;

      var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.classList.remove("anchor-pulse");
      void el.offsetWidth;
      el.classList.add("anchor-pulse");
      setTimeout(function () { el.classList.remove("anchor-pulse"); }, prefersReduced ? 2000 : 6000);

      el.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "nearest" });
    }

    function handleShareClick(e) {
      var btn = e.target.closest(".article-share");
      if (!btn) return;
      e.stopPropagation();
      var anchor = btn.getAttribute("data-anchor");
      if (!anchor) return;
      var url = window.location.origin + window.location.pathname + "#" + anchor;
      copyLink(btn, url);
    }

    function init() {
      revealAnchoredArticle();
      document.addEventListener("click", handleShareClick);
    }

    if (!window._anchorPulseRegistered) {
      window._anchorPulseRegistered = true;
      window.addEventListener("DOMContentLoaded", init);
      window.addEventListener("hashchange", revealAnchoredArticle);
    }
  })();
</script>
