# REQUIRED CHANGES
# Edit next line to provide your own name.
title: Charles Ouimet | Professional Portfolio
# Edit next line, replacing 'techfolios' with your github username
url: "https://ouimet.info"
# Edit next line so that baseurl is "" if your repo is <username>.github.io
baseurl: ""

# OPTIONAL CHANGES
## Specify the theme using any of the css files in css/techfolio-theme
techfolio-theme: default.css
## Specify the formatting for triple backquote code sections.
rouge-theme: github.css

# DON'T CHANGE THE FOLLOWING (unless you know what you're doing)
markdown: kramdown
kramdown:
  hard_wrap: false
  input: GFM
  syntax_highlighter: rouge
strict_front_matter: true
mathjax: true
exclude:
  - articles/_sources
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - .history
  - LICENSE
  - Makefile
  - micro-projects/network-nudge/eslint.config.js
  - micro-projects/network-nudge/node_modules
  - micro-projects/network-nudge/package.json
  - micro-projects/network-nudge/pnpm-lock.yaml
  - micro-projects/network-nudge/vitest.config.js
  - pyproject.toml
  - README.md
  - resume-docx-content-*.txt
  - resume-linkedin-content-*.txt
  - scripts
  - tests
  - uv.lock
include: []
plugins:
  - jekyll-gist
  - jekyll-sitemap
