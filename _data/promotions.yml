- date: "2026-07-07"
  context: https://ouimet.info/projects/network-nudge.html
  projects:
    - network-nudge
  anchor: network-nudge-launch
  summary: "Project launch"
  linkedin:
    url: https://www.linkedin.com/feed/update/urn:li:activity:7480441101800218625/
    content: |
      I got tired of copy-pasting outreach templates and manually replacing placeholders — and inevitably shipping one with a stale name or wrong URL.

      So I built Network Nudge: pick a template, fill in the shared fields once, and the preview updates live across all three message types. The copy button stays locked until every placeholder is filled, and the character counter flags when you're over LinkedIn's 300-char limit.

      👉 https://ouimet.info/projects/network-nudge/
  x:
    url: https://x.com/charlesouimet/status/2074675781020569799?s=20
    content: |
      Network Nudge — an outreach message builder I shipped today 🚀

      • 3 templates: direct application, cold reach-out, mutual intro request
      • Fill shared fields once, previews update live across all cards
      • Copy button locked until every placeholder is filled
      • LinkedIn 300-char limit enforced per template

      https://ouimet.info/projects/network-nudge/

