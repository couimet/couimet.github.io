      I got tired of copy-pasting outreach templates and manually replacing placeholders — and inevitably shipping one with a stale name or wrong URL.

      So I built Network Nudge: pick a template, fill in the shared fields once, and the preview updates live across all three message types. The copy button stays locked until every placeholder is filled, and the character counter flags when you're over LinkedIn's 300-char limit.

