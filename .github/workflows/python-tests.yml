# Runs the per-subproject Python test suites on every PR and on push to main.
# Scoped via paths filter so it only fires when one of the tracked projects or this workflow changes.
name: Python tests

on:
  pull_request:
    paths:
      - 'scripts/social-banner/**'
      - 'scripts/ghpages-redirect/**'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/social-banner/**'
      - 'scripts/ghpages-redirect/**'
      - '.github/workflows/python-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - scripts/social-banner
          - scripts/ghpages-redirect
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v4
      - name: Install deps
        run: uv sync --frozen --extra dev
        working-directory: ${{ matrix.project }}
      - name: Run tests
        run: uv run pytest tests/ -v
        working-directory: ${{ matrix.project }}
