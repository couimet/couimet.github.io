name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Validate articles data against schema
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/articles.schema.json
          file: _data/articles.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          header: 'Articles data YAML validation'

      - name: Validate promotions data against schema
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/promotions.schema.json
          file: _data/promotions.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          header: 'Promotions data YAML validation'

      - name: Run Python validation and unit tests
        run: make test-python

      - name: Upload coverage to Codecov
        uses: couimet/github-actions/codecov-upload@main
        with:
          files: coverage.lcov
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run BATS tests
        uses: couimet/github-actions/bats-test@main
        with:
          test-directory: bats-tests
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-python-subprojects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: scripts/social-banner
            flag: social-banner
            cov-args: --cov=settings --cov=utils --cov=generate
          - project: scripts/ghpages-redirect
            flag: ghpages-redirect
            cov-args: --cov=verify_redirects
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install deps
        run: uv sync --frozen --extra dev
        working-directory: ${{ matrix.project }}

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v ${{ matrix.cov-args }} --cov-report=lcov:coverage.lcov
        working-directory: ${{ matrix.project }}

      - name: Upload coverage to Codecov
        uses: couimet/github-actions/codecov-upload@main
        with:
          files: coverage.lcov
          working-directory: ${{ matrix.project }}
          flags: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}

  test-network-nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js & pnpm
        uses: couimet/github-actions/setup-node-pnpm@main
        with:
          node-version: '24'
          working-directory: micro-projects/network-nudge

      - name: Install dependencies
        uses: couimet/github-actions/install-deps@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Run tests
        shell: bash
        working-directory: micro-projects/network-nudge
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: couimet/github-actions/codecov-upload@main
        with:
          files: coverage/lcov.info
          working-directory: micro-projects/network-nudge
          flags: network-nudge
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'

      - name: Setup Node.js & pnpm
        uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install dependencies
        uses: couimet/github-actions/install-deps@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Markdown lint
        uses: couimet/github-actions/markdownlint@main

      - name: Lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Sync uv deps
        run: uv sync --frozen

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build and validate (ouimet.info)
        run: |
          bundle exec jekyll build --baseurl ""
          bundle exec htmlproofer _site --disable-external
          uv run --no-sync python scripts/validate-site-semantics.py --target ouimet.info
        env:
          JEKYLL_ENV: production

      - name: Build and validate (github.io)
        run: |
          bundle exec jekyll build --config _config.yml,_config_ghpages.yml --baseurl "${{ steps.pages.outputs.base_path }}"
          rm -f _site/resume-full.html _site/sitemap.xml
          bundle exec htmlproofer _site --disable-external
          uv run --no-sync python scripts/validate-site-semantics.py --target github.io
          uv run --no-sync python scripts/ghpages-redirect/verify_redirects.py _site
        env:
          JEKYLL_ENV: production

  check-generated:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check resume tool versions
        run: ./scripts/check-resume-tool-versions.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Check resume freshness
        uses: couimet/github-actions/check-generated-drift@main
        with:
          command: SKIP_VERSION_CHECK=true make sync-resume
          post-generate: git checkout -- resume-full.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          header: 'Resume generated drift check'

      - name: Check banner freshness
        uses: couimet/github-actions/check-generated-drift@main
        with:
          command: (cd scripts/social-banner && uv sync --frozen) && UV_FROZEN=1 make banner
          post-generate: cd scripts/social-banner && UV_FROZEN=1 uv run python check_banner_drift.py
          github-token: ${{ secrets.GITHUB_TOKEN }}
          header: 'Social banner generated drift check'
