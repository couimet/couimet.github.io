# Auto-fix workflow: When the "Verify sitemap snapshot" workflow fails on a PR,
# this regenerates the snapshot and opens a sibling PR with the fix.
# All logic lives in .github/actions/sitemap-fix/fix.sh (BATS-tested).
name: Sitemap snapshot auto-fix

on:
  workflow_run:
    workflows: ["Verify sitemap snapshot"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.fork == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Auto-fix sitemap snapshot
        uses: ./.github/actions/sitemap-fix
        with:
          head-branch: ${{ github.event.workflow_run.head_branch }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          pr-json: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
