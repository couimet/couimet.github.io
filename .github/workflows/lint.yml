name: Lint

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true

      - name: Setup Node.js & pnpm
        uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Validate articles.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/articles.schema.json
          file: _data/articles.yml

      - name: Validate promotions.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/promotions.schema.json
          file: _data/promotions.yml

      - name: Markdown lint
        uses: couimet/github-actions/markdownlint@main

      - name: Install dependencies
        uses: couimet/github-actions/install-deps@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Lint
        run: make lint
