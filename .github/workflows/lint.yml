name: Lint

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Validate articles.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/articles.schema.json
          file: _data/articles.yml

      - name: Validate promotions.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/promotions.schema.json
          file: _data/promotions.yml

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Install network-nudge dependencies
        shell: bash
        working-directory: micro-projects/network-nudge
        run: pnpm install

      - name: Lint
        run: make lint
