name: Lint

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af  # v1
        with:
          bundler-cache: true

      - name: Setup Node.js & pnpm
        uses: couimet/github-actions/setup-node-pnpm@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5

      - name: Validate articles.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/articles.schema.json
          file: _data/articles.yml

      - name: Validate promotions.yml
        uses: couimet/github-actions/validate-yaml@main
        with:
          schema: _data/promotions.schema.json
          file: _data/promotions.yml

      - name: Markdown lint
        uses: couimet/github-actions/markdownlint@main

      - name: Install dependencies
        uses: couimet/github-actions/install-deps@main
        with:
          working-directory: micro-projects/network-nudge

      - name: Lint
        run: make lint
