name: Sync JSON → YAML Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js & pnpm
        uses: couimet/github-actions/setup-node-pnpm@main

      - name: Sync resume
        run: ./scripts/sync-resume.sh
        env:
          SKIP_VERSION_CHECK: 'true'

      - name: Validate resume.yml output
        uses: couimet/github-actions/bats-test@main
        with:
          test-directory: bats-tests/sync-resume.bats
          recursive: 'false'
          publish-comment: 'false'

      - name: Commit generated YAML and HTML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main
          git add -f resume.yml resume-full.html
          git commit -m "chore: sync YAML resume and HTML [skip ci]" || echo "No changes"
          git push
