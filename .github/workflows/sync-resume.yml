name: Sync JSON → YAML Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Sync resume
        run: ./scripts/sync-resume.sh

      - name: Install BATS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Validate resume.yml output
        run: bats tests/sync-resume.bats

      - name: Commit generated YAML and HTML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main
          git add -f resume.yml resume-full.html
          git commit -m "chore: sync YAML resume and HTML [skip ci]" || echo "No changes"
          git push
