name: Verify sitemap snapshot

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          bundler-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      # Rebuilds the site, copies _site/sitemap.xml to .snapshots/sitemap.xml,
      # and fails on `git diff --exit-code` if the freshly built sitemap differs
      # from the tracked snapshot. Refresh locally with `make snapshot-sitemap`
      # and commit the result alongside the page changes that caused the drift.
      - name: Verify sitemap snapshot
        run: make verify-sitemap
