name: Verify sitemap snapshot

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      # Rebuilds the site, copies _site/sitemap.xml to .snapshots/sitemap.xml,
      # and fails on `git diff --exit-code` if the freshly built sitemap differs
      # from the tracked snapshot. Refresh locally with `make snapshot-sitemap`
      # and commit the result alongside the page changes that caused the drift.
      - name: Verify sitemap snapshot
        run: make verify-sitemap
